<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1D18" />
  <title>西游斗牌</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部标题 -->
    <header id="topbar">
      <h1>西游斗牌</h1>
      <div class="top-right">
        <div id="roomInfo" class="hidden"></div>
        <button id="btnBgm" class="mute-btn" type="button" aria-label="背景音乐开关" title="背景音乐开关" aria-pressed="false">乐</button>
        <button id="btnMute" class="mute-btn" type="button" aria-label="音效开关" title="音效开关">音</button>
      </div>
    </header>

    <!-- ========== 首页 ========== -->
    <section id="view-home" class="view">
      <div class="panel">
        <h2>加入牌局</h2>
        <label class="field">
          <span>你的昵称</span>
          <input id="nickname" type="text" maxlength="12" placeholder="如：孙悟空" autocomplete="off" />
        </label>
        <button id="btnCreate" class="btn primary">创建房间</button>
        <div class="divider"><span>或输入房间码</span></div>
        <div class="join-row">
          <input id="roomCode" type="text" maxlength="3" inputmode="numeric" pattern="[0-9]*" placeholder="666" class="code-input" />
          <button id="btnJoin" class="btn">加入</button>
        </div>
      </div>
      <p class="hint">3~6 人 · 一副扑克牌 · <b>败牌最少者通杀</b></p>
    </section>

    <!-- ========== 房间面板 ========== -->
    <section id="view-room" class="view hidden">
      <div class="panel">
        <div class="room-code-box">
          <span class="label">房间码</span>
          <span id="roomCodeBig" class="code-big"></span>
        </div>
        <p class="hint">同一 WiFi 下访问 <b id="lanUrl">本机地址</b>，输入房间码加入</p>
        <ul id="playerList" class="player-list"></ul>
        <div class="actions">
          <button id="btnReady" class="btn primary">准备</button>
          <button id="btnStart" class="btn hidden">开始游戏</button>
          <!-- AI 补位：非房主看不到；一个真人 + 2 个 AI 就能开局 -->
          <div class="actions-row">
            <button id="btnAddAI" class="btn hidden">加 AI</button>
            <button id="btnRemoveAI" class="btn hidden">踢 AI</button>
          </div>
          <button id="btnLeave" class="btn ghost">离开房间</button>
        </div>
        <p id="roomStatus" class="status"></p>
      </div>
    </section>

    <!-- ========== 对局视图 ========== -->
    <section id="view-game" class="view hidden">
      <div id="infoBar" class="info-bar">
        <span id="iRound"></span>
        <span id="iDraw"></span>
        <span id="iDir"></span>
      </div>

      <div id="gameArea">
        <div id="seats"></div>
        <div id="table">
          <div id="topCard" class="top-card"></div>
          <!-- 出牌方向环：一圈虚线椭圆轨道 + 一颗沿轨道空转的箭头（顺时针/逆时针）。
               方向信息由 #iDir 的文字承担，这层是纯视觉，所以 aria-hidden。
               环 pointer-events:none 且 z-index 在门槛牌之下（-1，只压过 #table 自己的底色），
               绝不吃点击、也不会糊住牌面与日志。方向由 app.js 按 st.direction 挂 ccw 类。 -->
          <div id="dirRing" class="dir-ring" aria-hidden="true">
            <div class="dir-disc">
              <!-- viewBox 120×120 + preserveAspectRatio=none：圆在页面上被拉成椭圆，
                   正好扣住 5:7 的牌形；轨道底部留 100° 缺口，永远避开下方文字行。 -->
              <svg class="dir-track" viewBox="0 0 120 120" preserveAspectRatio="none" focusable="false">
                <path class="dir-arc" d="M 26.6 99.8 A 52 52 0 1 1 93.4 99.8" />
                <g class="dir-orbit">
                  <!-- 三角形中心正好落在轨道半径上（y=8 即 60-52），否则箭头会飘在环内侧 -->
                  <polygon class="dir-arrow" points="54,3.5 54,12.5 63,8" />
                </g>
              </svg>
              <span class="dir-flag">反转</span>
            </div>
          </div>
          <!-- 压制冲击动画层：只放纯装饰节点（残影/冲击波/斩击线/火星），
               aria-hidden 保证读屏器忽略；position:absolute 不参与 #table 的 flex 布局。
               节点全部由 app.js 动态创建并在动画结束后自行移除，这里保持空壳。 -->
          <div id="fx" class="fx-layer" aria-hidden="true"></div>
          <div id="tableInfo" class="table-info"></div>
          <div id="eventLog" class="event-log"></div>
        </div>
      </div>

      <div id="promptBar" class="prompt-bar">
        <span id="promptText"></span>
        <!-- 回合倒计时：由 app.js 改它的 scaleX，不写 textContent（见 renderPrompt 注释） -->
        <div id="turnTimer" class="turn-timer hidden"><i></i></div>
      </div>

      <div id="handArea">
        <div id="handMeta" class="hand-meta"></div>
        <div id="hand" class="hand"></div>
        <div class="hand-actions">
          <button id="btnPlay" class="btn primary hidden">打出</button>
          <button id="btnPickup" class="btn danger hidden">收牌</button>
        </div>
      </div>
    </section>

    <!-- ========== 结算覆盖层 ========== -->
    <div id="view-settle" class="overlay hidden">
      <div class="panel settle-panel">
        <div class="winner-banner" id="winnerBanner"></div>
        <ul id="resultList" class="result-list"></ul>
        <!-- 终局账目闭合说明：「全场败牌合计 X 张 + 未发 N 张 = 54」。
             不加这行，玩家看到的败牌总和永远小于 54，却不知道差的那几张去了哪。 -->
        <p id="settleFoot" class="settle-foot"></p>
        <p class="hint">下一局由通杀者先出牌</p>
        <button id="btnNextRound" class="btn primary">再来一局</button>
      </div>
    </div>

    <!-- 动效层（出牌飞入 / 收牌飞走） -->
    <div id="fxLayer" class="fx-layer"></div>
    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
    <!-- 重连横幅 -->
    <div id="connBanner" class="conn-banner hidden">与服务器断开，正在重连…</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <!-- 音效引擎必须在 app.js 之前：app.js 在绑定事件时就会读 window.Sfx -->
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
