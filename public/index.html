<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>西游斗牌</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部标题 -->
    <header id="topbar">
      <h1>西游斗牌</h1>
      <div id="roomInfo" class="hidden"></div>
    </header>

    <!-- ========== 房间视图 ========== -->
    <section id="view-home" class="view">
      <div class="panel">
        <h2>加入牌局</h2>
        <label class="field">
          <span>你的昵称</span>
          <input id="nickname" type="text" maxlength="12" placeholder="如：孙悟空" autocomplete="off" />
        </label>
        <button id="btnCreate" class="btn primary">创建房间</button>
        <div class="divider">或</div>
        <div class="join-row">
          <input id="roomCode" type="text" maxlength="3" inputmode="numeric" pattern="[0-9]*" placeholder="如 666" class="code-input" />
          <button id="btnJoin" class="btn">加入房间</button>
        </div>
      </div>
      <p class="hint">3~6 人，使用一副扑克牌。<br/>先出完? 不——收牌最少者通杀!</p>
    </section>

    <!-- ========== 房间面板 ========== -->
    <section id="view-room" class="view hidden">
      <div class="panel">
        <div class="room-code-box">
          <span class="label">房间码</span>
          <span id="roomCodeBig" class="code-big"></span>
        </div>
        <p class="hint">让朋友在同一 WiFi 下访问 <b id="lanUrl">本机地址</b> 输入房间码加入</p>
        <ul id="playerList" class="player-list"></ul>
        <div class="actions">
          <button id="btnReady" class="btn primary">准备</button>
          <button id="btnStart" class="btn hidden">开始游戏</button>
          <button id="btnLeave" class="btn ghost">离开房间</button>
        </div>
        <p id="roomStatus" class="status"></p>
      </div>
    </section>

    <!-- ========== 对局视图 ========== -->
    <section id="view-game" class="view hidden">
      <div id="infoBar" class="info-bar">
        <span id="iRound"></span>
        <span id="iDraw"></span>
        <span id="iDir"></span>
      </div>

      <!-- 牌桌区：座位环 + 桌面（座位在边缘，桌面居中，互不遮挡） -->
      <div id="gameArea">
        <div id="seats"></div>
        <div id="table">
          <div id="topCard" class="top-card"></div>
          <div id="tableInfo" class="table-info"></div>
          <div id="eventLog" class="event-log"></div>
        </div>
      </div>

      <!-- 操作提示条 -->
      <div id="promptBar" class="prompt-bar"></div>

      <!-- 手牌区 -->
      <div id="handArea">
        <div id="hand" class="hand"></div>
        <div class="hand-actions">
          <button id="btnPlay" class="btn primary hidden">打出</button>
          <button id="btnPickup" class="btn danger hidden">收牌（无牌可出）</button>
        </div>
      </div>
    </section>

    <!-- ========== 结算覆盖层 ========== -->
    <div id="view-settle" class="overlay hidden">
      <div class="panel settle-panel">
        <h2>本局结束</h2>
        <div id="winnerBanner" class="winner-banner"></div>
        <ul id="resultList" class="result-list"></ul>
        <p class="hint">下一局由通杀者先出牌</p>
        <button id="btnNextRound" class="btn primary">再来一局</button>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
    <!-- 重连横幅 -->
    <div id="connBanner" class="conn-banner hidden">与服务器断开，正在重连…</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
